serenity {
  project.name = "OpenCart - Compra E2E Guest Checkout"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  base.url = "http://opencart.abstracta.us/"
  wait.for.timeout = 20000
  timeouts {
    implicitlywait = 3000
    fluentwait = 20000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "window-size=1920,1080", "remote-allow-origins=*",
              "disable-infobars", "disable-popup-blocking", "incognito"]
    }
  }
}
